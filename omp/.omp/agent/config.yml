symbolPreset: nerd
theme: 
  dark: atlas-statusline
  light: light-catppuccin
setupVersion: 1
power: 
  sleepPrevention: idle
steeringMode: one-at-a-time
memory: 
  backend: mnemopi
edit: 
  mode: hashline
colorBlindMode: false
statusLine: 
  preset: custom
  separator: ascii
  sessionAccent: true
  leftSegments: 
    - pi
    - model
    - mode
    - path
    - git
    - pr
    - context_pct
    - cache_hit
  rightSegments: 
    - session_name
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 24
  transparent: false
  showHookStatus: true
modelRoles: 
  default: openai-codex/gpt-5.5
  commit: deepseek/deepseek-v4-flash
  plan: anthropic/claude-opus-4-8
  slow: openai-codex/gpt-5.5:xhigh
  smol: openai-codex/gpt-5.4-nano
browser: 
  headless: true
  screenshotDir: ~/Pictures/agent-screenshots
  cmux: false
tui: 
  hyperlinks: auto
  textSizing: false
marketplace: 
  autoUpdate: auto
todo: 
  reminders: 
    max: 5
  eager: default
search: 
  contextAfter: 3
vault: 
  enabled: true
github: 
  enabled: true
  cache: 
    enabled: true
task: 
  isolation: 
    mode: auto
  enableLsp: true
  showResolvedModelBadge: true
  eager: default
commands: 
  enableOpencodeUser: false
  enableOpencodeProject: false
secrets: 
  enabled: true
display: 
  shimmer: kitt
  showTokenUsage: true
  smoothStreaming: true
defaultThinkingLevel: auto
followUpMode: one-at-a-time
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: default
autocompleteMaxVisible: 5
eval: 
  js: true
providers: 
  image: openai
  fetch: auto
  tinyModel: online
  webSearch: auto
codexResets: 
  autoRedeem: unset
startup: 
  quiet: true