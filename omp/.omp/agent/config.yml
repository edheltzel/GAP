providers:
  webSearchOrder:
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme:
  dark: atlas-eldritch
  light: light-tokyo-night
setupVersion: 1
extensions:
  - ~/.omp/agent/extensions/atlas-status-line.ts
  - ~/.omp/agent/extensions/omp-prompt-template-model/src/main.ts
statusLine:
  preset: custom
  leftSegments:
    []
  rightSegments:
    []
  separator: powerline-thin
  sessionAccent: false
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
terminal:
  showProgress: false
display:
  showTokenUsage: true
  cacheMissMarker: false
  shimmer: kitt
showHardwareCursor: true
task:
  showResolvedModelBadge: false
  eager: default
  enableLsp: false
  agentModelOverrides:
    code-reviewer: sol
    code-simplifier: sol
tui:
  tight: false
defaultThinkingLevel: auto
textVerbosity: high
personality: default
advisor:
  enabled: false
  subagents: true
interruptMode: immediate
loop:
  mode: prompt
treeFilterMode: default
stt:
  submitTrigger: never
collab:
  displayName: ▲
marketplace:
  autoUpdate: auto
power:
  sleepPrevention: "off"
compaction:
  handoffSaveToDisk: true
checkpoint:
  enabled: true
vault:
  enabled: true
github:
  enabled: true
todo:
  eager: default
  remindersMax: 5
hideThinkingBlock: false
secrets:
  enabled: true
modelRoles:
  commit: openrouter/deepseek/deepseek-v4-flash
  advisor: openai-codex/gpt-5.6-sol:xhigh
  slow: opencode-zen/grok-4.5
  smol: openrouter/deepseek/deepseek-v4-flash
  designer: openrouter/moonshotai/kimi-k3
  plan: anthropic/claude-fable-5:xhigh
  default: xai-oauth/grok-4.5:medium
  vision: openai-codex/gpt-5.6-terra
  task: xai-oauth/grok-4.5
  REVIEWER: openai-codex/gpt-5.6-sol:xhigh
  tiny: openai-codex/gpt-5.6-luna
colorBlindMode: true
dev:
  autoqaConsent: granted
browser:
  cmux: false
  screenshotDir: /Users/ed/Pictures/agent-screenshots/
inspect_image:
  mode: "on"
astGrep:
  enabled: true
tasks:
  todoClearDelay: 60
startup:
  changelogMode: summary
retry:
  fallbackChains:
    tiny:
      - openrouter/deepseek/deepseek-v4-flash
    commit:
      - openai-codex/gpt-5.6-luna
    designer:
      - anthropic/claude-opus-5
