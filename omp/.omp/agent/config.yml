providers: 
  webSearch: codex
symbolPreset: nerd
theme: 
  dark: atlas-default
  light: light-tokyo-night
setupVersion: 1
extensions: 
  - ~/.omp/agent/extensions/atlas-status-line.ts
statusLine: 
  preset: custom
  leftSegments: 
    []
  rightSegments: 
    []
  separator: powerline-thin
  sessionAccent: false
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
terminal: 
  showProgress: false
display: 
  showTokenUsage: true
  cacheMissMarker: false
  shimmer: kitt
showHardwareCursor: true
task: 
  showResolvedModelBadge: false
  eager: default
  enableLsp: false
  agentModelOverrides: 
    code-reviewer: sol
    code-simplifier: sol
tui: 
  tight: false
defaultThinkingLevel: auto
textVerbosity: high
personality: default
advisor: 
  enabled: false
  subagents: true
interruptMode: immediate
loop: 
  mode: prompt
treeFilterMode: default
stt: 
  submitTrigger: never
collab: 
  displayName: ▲
marketplace: 
  autoUpdate: auto
collapseChangelog: true
power: 
  sleepPrevention: "off"
compaction: 
  handoffSaveToDisk: true
checkpoint: 
  enabled: true
vault: 
  enabled: true
github: 
  enabled: true
todo: 
  reminders: 
    max: 5
  eager: default
  remindersMax: 5
hideThinkingBlock: false
secrets: 
  enabled: true
modelRoles: 
  default: openai-codex/gpt-5.6-sol:high
  commit: openrouter/deepseek/deepseek-v4-flash
  plan: anthropic/claude-opus-4-8:xhigh
  smol: openai-codex/gpt-5.4-mini:high
  advisor: openai-codex/gpt-5.6-sol-pro:max
  slow: openai-codex/gpt-5.6-sol-pro:high
colorBlindMode: true
dev: 
  autoqa: 
    consent: granted
browser: 
  cmux: false
  screenshotDir: /Users/ed/Pictures/agent-screenshots/
inspect_image: 
  enabled: true
astGrep: 
  enabled: true
tasks: 
  todoClearDelay: 60