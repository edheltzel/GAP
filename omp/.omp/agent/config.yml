symbolPreset: nerd
theme: 
  dark: dark
  light: light
setupVersion: 1
power: 
  sleepPrevention: idle
steeringMode: one-at-a-time
memory: 
  backend: mnemopi
edit: 
  mode: hashline
  streamingAbort: false
colorBlindMode: false
statusLine: 
  preset: custom
  separator: ascii
  sessionAccent: true
  leftSegments: 
    - pi
    - model
    - mode
    - path
    - git
    - pr
    - context_pct
    - cache_hit
  rightSegments: 
    - session_name
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 24
  transparent: false
  showHookStatus: true
modelRoles: 
  default: openai-codex/gpt-5.5
  commit: deepseek/deepseek-v4-flash
  plan: anthropic/claude-opus-4-8
  slow: openai-codex/gpt-5.5:xhigh
  smol: openai-codex/gpt-5.4-nano
browser: 
  headless: true
  screenshotDir: ~/Pictures/agent-screenshots
  cmux: true
tui: 
  hyperlinks: auto
  textSizing: true
  tight: false
marketplace: 
  autoUpdate: auto
todo: 
  reminders: 
    max: 5
  eager: default
vault: 
  enabled: true
github: 
  enabled: true
  cache: 
    enabled: true
task: 
  isolation: 
    mode: auto
  enableLsp: true
  showResolvedModelBadge: true
  eager: default
commands: 
  enableOpencodeUser: false
  enableOpencodeProject: false
secrets: 
  enabled: true
display: 
  shimmer: kitt
  showTokenUsage: true
  smoothStreaming: true
  cacheMissMarker: true
defaultThinkingLevel: auto
followUpMode: one-at-a-time
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: default
autocompleteMaxVisible: 5
eval: 
  js: true
providers: 
  image: openai
  fetch: auto
  tinyModel: online
  webSearch: auto
  tts: auto
  kimiApiFormat: anthropic
codexResets: 
  autoRedeem: unset
startup: 
  quiet: true
dev: 
  autoqa: 
    consent: granted
grep: 
  contextAfter: 3
terminal: 
  showProgress: true
includeWorkspaceTree: true
advisor: 
  enabled: false
  subagents: true
  syncBacklog: "off"
loop: 
  mode: prompt
tools: 
  approvalMode: yolo
stt: 
  enabled: false
  modelName: parakeet
collab: 
  webUrl: ""
  displayName: Atlas
share: 
  serverUrl: https://my.omp.sh/s
features: 
  unexpectedStopDetection: true
branchSummary: 
  enabled: false
compaction: 
  strategy: snapcompact
  thresholdPercent: -1
  thresholdTokens: -1
  handoffSaveToDisk: true
  idleEnabled: false
ttsr: 
  interruptMode: always
  repeatMode: once
  repeatGap: 10
mnemopi: 
  dbPath: ""
  scoping: per-project
  llmMode: smol
readLineNumbers: false
read: 
  toolResultPreview: false
lsp: 
  formatOnWrite: false
  diagnosticsOnEdit: true
bash: 
  autoBackground: 
    enabled: true
shellMinimizer: 
  sourceOutlineLevel: default
python: 
  interpreter: ""
inspect_image: 
  enabled: true
checkpoint: 
  enabled: true
exa: 
  enableResearcher: true
  enableWebsets: false