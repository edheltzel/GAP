  "do-no-comments",
  "do-no-use-effect",
  "do-parse-dont-validate",
  "do-perf",
  "do-plan",
  "do-readme-update",
  "do-recipe-diagrams",
  "do-redteam",
  "do-regroup",
  "do-review-frontend",
  "do-review-ios",
  "do-show-me",
  "do-simplify",
  "do-skill-craft",
  "do-teach-me",
  "do-tech-writing",
  "do-todo",
  "do-ts-standards",
  "do-typescript-refactoring",
  "do-ux-flow-plan",
  "do-work",
  "do-write-typescript",
  "keyword-research",
  "project-setup",
  "seo-action-plan",
  "seo-foundations",
  "site-audit",
