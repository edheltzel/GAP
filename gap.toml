schema = "2"
name   = "edheltzel/GAP"

[components.forge]
repo   = "github.com/edheltzel/Forge"
ref    = "master"

[components.echo]
repo  = "github.com/edheltzel/Echo"
ref   = "v0.14.0"
# macOS only. Doctor and install come from the repo's gap-utility.toml.
# An empty names keeps the selection known before the store is fetched.
names = []

[components.recall]
repo    = "github.com/edheltzel/Recall"
ref     = "main"
# Recall owns do-recall-* and installs them itself through its gap-utility.toml hooks.

