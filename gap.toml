  "do-art",
  "do-astro",
  "do-backend",
  "do-behavioral-testing",
  "do-bitter-pill",
  "do-brainstorm",
  "do-cleanup-swift",
  "do-cleanup-web",
  "do-code-comments",
  "do-commit",
  "do-create-cli",
  "do-debug",
  "do-delegation",
  "do-design-patterns-gof",
  "do-design-system",
  "do-doc-review",
  "do-docs",
  "do-ducky",
  "do-first-principles",
  "do-gh-pm",
  "do-gh-stack",
  "do-git-pr-babysit",
  "do-git-pr-comment",
  "do-git-pr-review",
  "do-git-pr-review-triage",
  "do-git-safe-pr-workflow",
  "do-git-worktree",
