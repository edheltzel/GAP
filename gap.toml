schema = "2"
name   = "edheltzel/GAP"

[components.forge]
repo   = "github.com/edheltzel/Forge"
ref    = "master"

[components.echo]
repo    = "github.com/edheltzel/Echo"
ref     = "v0.13.0"
doctor  = "cli/echo doctor"
install = "scripts/install.sh"
# macOS only. Adapters install through scripts/install.sh --adapter.
names   = []

[components.recall]
repo    = "github.com/edheltzel/Recall"
ref     = "main"
# Recall owns do-recall-* and installs them itself through its gap-utility.toml hooks.

[components.do-skills]
repo  = "github.com/edheltzel/Do-Skills"
ref   = "master"
names = [
